name: D-006 downstream ownership migration research

on:
  push:
    branches:
      - research/d006-downstream-ownership-migration
    paths:
      - docs/research/F-*.md
      - docs/plans/F-*.md
      - .github/workflows/f*.yml
      - .github/workflows/f*.yaml
      - tests/f*/**
      - scripts/research/d005_downstream_ownership_inventory.py
      - docs/research/D-006-*.md
      - .github/workflows/d006-downstream-ownership-migration-research.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d006-research-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Re-audit current downstream ownership state
        shell: bash
        run: |
          python scripts/research/d005_downstream_ownership_inventory.py > "$RUNNER_TEMP/d006-inventory.json"
          cat "$RUNNER_TEMP/d006-inventory.json"
          python - "$RUNNER_TEMP/d006-inventory.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)

          assert data["research_features"] == 22, data["research_features"]
          assert data["research_authority_errors"] == [], data["research_authority_errors"]
          assert data["plans"]["count"] == 22, data["plans"]["count"]
          assert data["plans"]["status_counts"] == {"matching": 19, "missing": 3}, data["plans"]["status_counts"]
          assert data["workflows"]["count"] == 19, data["workflows"]["count"]
          assert data["workflows"]["status_counts"] == {"missing": 19}, data["workflows"]["status_counts"]
          assert data["test_packages"]["count"] == 13, data["test_packages"]["count"]
          assert data["test_packages"]["status_counts"] == {"missing": 13}, data["test_packages"]["status_counts"]
          PY
