name: R-016 approximate execution research

on:
  push:
    branches:
      - research/r-016-approximate-execution-policy
    paths:
      - .github/workflows/r016-approximate-policy.yml
      - docs/research/R-016-approximate-execution-policy.md
      - scripts/research/r016_policy.py
      - tests/research/test_r016_policy.py
  pull_request:
    paths:
      - .github/workflows/r016-approximate-policy.yml
      - docs/research/R-016-approximate-execution-policy.md
      - scripts/research/r016_policy.py
      - tests/research/test_r016_policy.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/research/test_r016_policy.py
