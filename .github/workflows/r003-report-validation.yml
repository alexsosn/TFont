name: R-003 report validation

on:
  push:
    branches:
      - research/r-003-ergonomics
    paths:
      - .github/workflows/r003-report-validation.yml
      - tests/research/test_r003_report.py
      - docs/research/R-003-ergonomics.md
      - docs/research/R-003-reconciliation.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate reconciled R-003 research contract
        run: python -m unittest tests.research.test_r003_report -v
