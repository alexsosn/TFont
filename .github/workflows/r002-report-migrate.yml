name: R-002 one-time report migration

on:
  push:
    branches:
      - research/r-002-ontology-governance
    paths:
      - .github/workflows/r002-report-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate reconciled ontology contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/research/R-002-ontology-governance.md')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "| **core infrastructure** | SKOS, PROV-O, Web Annotation; SHACL 1.0 for RDF validation tooling |",
              "| **supported foundation models** | SKOS, OLiA, OntoLex-Lemon core, CIDOC CRM 7.1.3, CRMtex 2.0, LRMoo 1.1.1, CRMinf 1.2.1; PROV-O for provenance; SHACL 1.0 for RDF validation tooling |",
              'support table foundation',
          )
          replace_once(
              "| **optional supported domain profiles** | CRMarchaeo 2.1.1, CRMsci 3.2 |",
              "| **optional supported domain/publication profiles** | CRMarchaeo 2.1.1, CRMsci 3.2, LexInfo 3.0, OntoLex Lexicog 2019, OntoLex VarTrans, Web Annotation |",
              'support table optional',
          )
          replace_once(
              "TFont must not infer semantic identity from similar labels. Formal equivalence is exceptional. Approximate mappings use SKOS mapping relations, with the corpus-native assertion remaining authoritative.",
              "TFont must not infer semantic identity from similar labels. Formal equivalence is exceptional. Every mapping carries a formalism-neutral **mapping assessment** (`exact | close | broader | narrower | related | ambiguous | native-only | unsupported`) for query planning and UX, while an independent **publication relation** records an RDF/OWL/SKOS formalization only when the target model justifies one. The corpus-native assertion remains authoritative.",
              'mapping assessment separation',
          )
          replace_once(
              "The R-005 evidence indicates one recurrent gap large enough to justify an initial small TFont vocabulary: **text-critical apparatus assertions**, especially variation units, readings, witness attestation and explicit witness absence. Existing CAO/SAWS models are useful prior art, but their maintenance/licensing/model dependencies are not strong enough to make either the POC's normative apparatus model.",
              "R-005 demonstrates full variation-unit/reading/witness-attestation/explicit-absence apparatus semantics robustly in Pseudepigrapha-TF, but not in a second independent corpus. Peshitta A/B witness metadata and TLHdig line→fragment witness links are related assertions, not equivalent reading-at-locus apparatus graphs. Therefore the foundation POC should **not mint** apparatus-specific TFont domain vocabulary yet; keep those semantics native/profile-local and retain CAO/SAWS as prior art until recurrence or mapping-infrastructure necessity is established.",
              'apparatus decision',
          )

          marker = "## 4. Mapping-strength policy\n\n"
          addition = marker + "TFont separates a reified **mapping assessment** from any RDF **publication relation**. The assessment controls runtime/query behavior; it does not automatically select an RDF predicate. Formalization follows the native formalism of the target ontology or remains an explicit TFont mapping assertion when no safe RDF/OWL/SKOS relation exists.\n\n"
          replace_once(marker, addition, 'mapping policy preamble')

          replace_once(
              "### 4.2 SKOS mappings\n\nFor concepts/categories:",
              "### 4.2 SKOS mappings\n\nSKOS mapping predicates are used only when the mapped resources are genuinely SKOS concepts in concept schemes. They are not a generic encoding for mappings to OWL/RDFS classes or properties such as OLiA or CIDOC CRM. For genuine SKOS concepts:",
              'SKOS scope',
          )
          replace_once(
              "The compact R-005 words `same`, `close`, `broader/narrower`, `related`, `unknown` and `local-only` should become UI/reporting labels over explicit formal relations, not a second independent relation algebra.",
              "The compact R-005 candidate words are research evidence only. Approved mappings receive a reviewed TFont assessment; that assessment remains separate from RDF formalization. For OWL/RDFS class/property targets, use `rdfs:subClassOf` / `rdfs:subPropertyOf` or OWL equivalence only when logically justified, otherwise publish the reified TFont assertion without manufacturing a SKOS predicate.",
              'cross formalism',
          )

          replace_once(
              "| Web Annotation | W3C Recommendation, 2017 | 5 | 5 | 5 | 5 | core |",
              "| Web Annotation | W3C Recommendation, 2017 | 5 | 5 | 5 | 5 | optional publication/targeting profile |",
              'Web Annotation matrix',
          )
          replace_once(
              "| SAWS | v2.1 model; CC BY-NC-SA 3.0 project licensing | 2 | 2 | 4 | 4 | reference only |",
              "| SAWS | v2.1 model; reusable ontology license not established from authoritative distribution inspected | 2 | 2 | 4 | 4 | reference only |",
              'SAWS matrix',
          )

          replace_once(
              "**Role:** portable expression of annotations targeting corpus entities or source spans.\n\nThis is a better maintained infrastructure choice than using POWLA as the generic RDF annotation layer.",
              "**Role:** supported **optional publication/targeting** profile for portable annotations targeting corpus entities or source spans. It is not required by every TFont profile or runtime mapping.\n\nThis is a better maintained publication/targeting choice than using POWLA as the generic RDF annotation layer where portable annotation exchange is actually needed.",
              'Web Annotation role',
          )

          replace_once(
              "SAWS models relationships among ancient wisdom texts and witnesses and remains valuable prior art for intertextual/textual relationships. The published project materials are under **CC BY-NC-SA 3.0**, which conflicts with TFont's requirement that normative semantic dependencies remain usable in commercial environments.\n\nIts historical dependence on FRBRoo is another reason not to adopt it as the POC's base apparatus model now that LRMoo is available.\n\nDecision: reference/alignment only.",
              "SAWS models relationships among ancient wisdom texts and witnesses and remains valuable prior art for intertextual/textual relationships. The authoritative ontology distribution inspected for R-002 establishes the model/version/PURL but does **not establish a reusable ontology license**. TFont therefore records the license as unknown/not established rather than inferring either permissive or non-commercial terms.\n\nIts historical dependence on FRBRoo and the unresolved reuse rights are reasons not to adopt it as a normative POC dependency now that LRMoo is available.\n\nDecision: reference/alignment only unless authoritative licensing and current-model evidence are later established and pinned.",
              'SAWS section',
          )

          replace_once(
              "Decision: use CAO as explicit prior art and publish alignments where justified, but define the minimum recurrent apparatus concepts locally in TFont.",
              "Decision: use CAO as explicit prior art and publish alignments where justified. Keep apparatus domain concepts native/profile-local in the foundation POC until a second independent corpus establishes the same semantic gap or the design proves a term is required for TFont mapping infrastructure itself.",
              'CAO decision',
          )

          replace_once(
              "### 12.1 Text-critical concepts\n\nProposed conceptual scope for the later design ticket:\n\n- `tfont:VariationUnit` — a locus/unit at which the edition distinguishes readings or explicit witness states;\n- `tfont:Reading` — a reading option asserted for a variation unit;\n- `tfont:attestedBy` — reading → witness/source attestation;\n- `tfont:explicitlyAbsentIn` — variation unit/reading state → witness where the source explicitly records absence rather than merely lacking data.\n\nThese names are conceptual placeholders, not approved production URIs. The design ticket must test them against Pseudepigrapha-TF and any other apparatus-bearing corpus before freezing them.\n\n`Witness` itself should preferably map to an appropriate established bibliographic/heritage entity when its native semantics are known; TFont does not need to invent a universal witness class merely because several corpora use the word `witness` differently.",
              "### 12.1 Text-critical concepts\n\nDo **not mint** TFont-local apparatus domain terms in the foundation POC. R-005 establishes full variation-unit/reading/witness-attestation/explicit-absence semantics in Pseudepigrapha-TF only; Peshitta witness designations and TLHdig fragment links do not constitute a second independent corpus with the same apparatus relation. Preserve the Pseudepigrapha-TF concepts natively/profile-locally and document the external ontology gap.\n\nA later governance/design change may mint an apparatus term only after a **second independent corpus** requires the same semantic gap, or after the term is shown to be necessary for TFont's mapping-contract infrastructure rather than one corpus domain. `Witness` should likewise map to an established bibliographic/heritage entity when the native semantics justify it rather than being universalized from a shared label.",
              'local apparatus vocabulary',
          )

          text = text.replace(
              "- mapping strength — use SKOS/OWL as appropriate;",
              "- mapping strength — use the TFont mapping-assessment contract; publish SKOS/OWL/RDFS relations only where the target formalism justifies them;",
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit report and remove migration workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/r002-report-migrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/research/R-002-ontology-governance.md .github/workflows/r002-report-migrate.yml
          git commit -m 'research: consolidate reconciled R-002 contract'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
