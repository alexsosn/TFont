name: I-009 bootstrap candidate resources

on:
  push:
    branches:
      - impl/i009-production-noun-bundles
    paths:
      - 'scripts/i009_generate_candidate_resources.py'
      - '.github/workflows/i009-bootstrap-candidate-resources.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: impl/i009-production-noun-bundles
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Generate deterministic semantic candidate resources
        run: python scripts/i009_generate_candidate_resources.py
      - name: Fetch exact OLiA snapshot and upstream data license
        shell: bash
        run: |
          set -euo pipefail
          revision=d3bd4f1aef9047b33186bfb2a1795401f3f1a4a6
          rm -rf /tmp/i009-olia
          git init -q /tmp/i009-olia
          git -C /tmp/i009-olia remote add origin https://github.com/acoli-repo/olia.git
          git -C /tmp/i009-olia fetch -q --depth=1 origin "$revision"
          git -C /tmp/i009-olia checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/i009-olia rev-parse HEAD)" = "$revision"
          dest="src/tfont/resources/ontologies/olia/$revision"
          mkdir -p "$dest"
          cp /tmp/i009-olia/owl/core/olia.owl "$dest/olia.owl"
          cp /tmp/i009-olia/LICENSE.data "$dest/LICENSE.data"
          python - <<'PY'
          from pathlib import Path
          from tfont.digests import evidence_payload_digest

          revision = "d3bd4f1aef9047b33186bfb2a1795401f3f1a4a6"
          path = Path("src/tfont/resources/ontologies/olia") / revision / "olia.owl"
          actual = evidence_payload_digest(path.read_bytes())
          expected = "sha256:5983683f27ba524027ffa12a02aead4a115baf9c8933079eabbb4aa71be4e9fd"
          if actual != expected:
              raise SystemExit(f"OLiA snapshot digest mismatch: {actual}")
          print(f"verified exact OLiA snapshot: {actual}")
          PY
      - name: Commit generated candidate resources
        shell: bash
        run: |
          set -euo pipefail
          git add src/tfont/resources
          if git diff --cached --quiet; then
            echo 'candidate resources already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'I-009 GREEN: bootstrap exact candidate resources'
          git push origin HEAD:impl/i009-production-noun-bundles
