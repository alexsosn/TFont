name: R-005 generated inventory validation

on:
  push:
    branches:
      - research/r-005-corpus-semantic-census
    paths:
      - .github/workflows/r005-generated-validation.yml
      - tests/research/test_r005_generated.py
      - docs/research/data/R-005-corpus-pins.json
      - docs/research/data/generated/r005/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate generated inventories against pinned research contract
        run: python -m unittest tests.research.test_r005_generated -v
