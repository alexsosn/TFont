name: I-004 semantic validation

on:
  push:
    branches:
      - research/i-004-cross-artifact-semantic-validation
  pull_request:
    paths:
      - 'src/tfont/**'
      - 'tests/i004/**'
      - 'tests/i001/**'
      - 'tests/i002/**'
      - 'tests/i003/**'
      - 'tests/p002/**'
      - 'tests/packaging/**'
      - 'docs/research/I-004-cross-artifact-semantic-validation.md'
      - 'docs/plans/I-004-cross-artifact-semantic-validation-plan.md'
      - '.github/workflows/i004-semantic-validation.yml'

jobs:
  contract:
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . build
      - name: I-004 focused
        run: python -m unittest discover -s tests/i004 -v
      - name: I-001 regressions
        run: python -m unittest discover -s tests/i001 -v
      - name: I-002 regressions
        run: python -m unittest discover -s tests/i002 -v
      - name: P-002 regressions
        run: python -m unittest discover -s tests/p002 -v
      - name: I-003 regressions
        run: python -m unittest discover -s tests/i003 -v
      - name: Packaging regressions
        run: python -m unittest discover -s tests/packaging -v
      - name: Full suite
        run: python -m unittest discover -s tests -v
