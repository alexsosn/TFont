name: F-004 source-bundle diagnostic paths

on:
  push:
    branches:
      - fix/source-bundle-diagnostic-paths
    paths:
      - .github/workflows/f004-source-bundle-diagnostic-paths.yml
      - docs/research/F-004-source-bundle-diagnostic-paths.md
      - docs/plans/F-004-source-bundle-diagnostic-paths-plan.md
      - src/tfont/digests.py
      - tests/i002/**
      - pyproject.toml
  pull_request:
    paths:
      - .github/workflows/f004-source-bundle-diagnostic-paths.yml
      - docs/research/F-004-source-bundle-diagnostic-paths.md
      - docs/plans/F-004-source-bundle-diagnostic-paths-plan.md
      - src/tfont/digests.py
      - tests/i002/**
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run F-004 focused regression
        run: python -m unittest tests.i002.test_source_bundle_diagnostic_paths -v

      - name: Run I-002 suite
        run: python -m unittest discover -s tests/i002 -v

      - name: Run repository test suite
        run: python -m unittest discover -s tests -v
