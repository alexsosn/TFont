name: F-015 direct validation source boundary

on:
  push:
    branches:
      - stability/f-015-direct-validation-boundary
    paths:
      - src/tfont/source_validation.py
      - tests/f015/**
      - tests/f006/**
      - tests/i001/**
      - docs/research/F-015-direct-validation-source-boundary.md
      - docs/plans/F-015-direct-validation-source-boundary-plan.md
      - .github/workflows/f015-direct-validation-boundary.yml
  pull_request:
    paths:
      - src/tfont/source_validation.py
      - tests/f015/**
      - tests/f006/**
      - tests/i001/**
      - docs/research/F-015-direct-validation-source-boundary.md
      - docs/plans/F-015-direct-validation-source-boundary-plan.md
      - .github/workflows/f015-direct-validation-boundary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . build
      - name: Run F-015 focused RED/GREEN contract
        run: python -m unittest discover -s tests/f015 -v
      - name: Run F-006 loader-depth regressions
        run: python -m unittest discover -s tests/f006 -v
      - name: Run I-001 validation regressions
        run: python -m unittest discover -s tests/i001 -v
