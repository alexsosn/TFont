# Issue: #121
name: F-024 ownership namespace scan failures

on:
  push:
    branches:
      - research/f024-namespace-scan-failures
  pull_request:
    paths:
      - "docs/research/F-*.md"
      - "docs/plans/F-*.md"
      - ".github/workflows/f*.yml"
      - ".github/workflows/f*.yaml"
      - "tests/f*/**"
      - "scripts/check_f_series_ownership.py"
      - "tests/f024/**"
      - "docs/research/F-024-*.md"
      - "docs/plans/F-024-*.md"
      - ".github/workflows/f024-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f024-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  namespace-scan-failures:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run F-024 focused RED/GREEN contract
        run: python -m unittest discover -s tests/f024 -v
      - name: Run F-023 ownership regressions
        if: always()
        run: python -m unittest discover -s tests/f023 -v
      - name: Run F-021 ownership regressions
        if: always()
        run: python -m unittest discover -s tests/f021 -v
      - name: Run D-006 migration regressions
        if: always()
        run: python -m unittest discover -s tests/d006 -v
      - name: Run repository ownership checker
        if: always()
        run: python scripts/check_f_series_ownership.py .
