name: R-004 one-time report migration

on:
  push:
    branches:
      - research/r-004-documentation-architecture
    paths:
      - .github/workflows/r004-report-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate reconciled documentation contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/research/R-004-documentation-architecture.md')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "- a stale parent-schema binding fails closed.",
              "- compatibility is documented with R-001 evidence states (`verified-exact`, `verified-compatible`, `unverified`, `incompatible`); only verified states may activate, and the page exposes parent artifact/dependency evidence rather than a generic stale-schema flag.",
              'normative compatibility rule',
          )

          anchor = "### 3.2 TFont mapping assertions\n\n"
          addition = anchor + "Generated documentation distinguishes three objects that must not be collapsed: **research candidate** evidence such as the R-005 `S/C/B/N/R/U/L` matrix, an **approved mapping** with a reviewed TFont assessment, and any optional **formal publication** relation in RDF/OWL/SKOS. Research candidates may be linked as evidence but never rendered as released mappings merely because they appear semantically plausible.\n\n"
          replace_once(anchor, addition, 'mapping-object separation')

          replace_once(
              "- relation strength;\n- applicability conditions;",
              "- TFont `assessment.strength` used by runtime/query planning;\n- optional formal publication relation/pattern, displayed separately from the assessment;\n- applicability conditions;",
              'mapping detail relation fields',
          )

          replace_once(
              "- `incompatible` / unavailable profile",
              "- `verified-exact` / `verified-compatible` compatibility evidence where relevant\n- `unverified`\n- `incompatible` / unavailable profile",
              'UI compatibility vocabulary',
          )

          marker = "### Evidence uncertainty versus mapping strength\n\n"
          addition2 = marker + "Mapping strength here means the TFont **assessment**, not automatically an RDF predicate. The generated page renders any **formal publication** relation separately. For an OWL-class target, `assessment: exact` does not by itself assert `owl:equivalentClass` or `skos:exactMatch`; genuine SKOS predicates are shown only for reviewed concept-scheme mappings.\n\n"
          replace_once(marker, addition2, 'assessment formalization separation')

          replace_once(
              "Parent revision:    <exact tested commit>\nSchema fingerprint: <digest>\nMapping source:     <source digest/revision>",
              "Parent revision:    <exact tested commit>\nParent artifact:    <transport-independent semantic-content digest>\nDependency fingerprint: <profile dependency evidence digest>\nMapping source:     <source digest/revision>",
              'provenance artifact identity',
          )

          cuc_anchor = "The exact observed domains should be generated from the accepted R-005 inventory, not typed manually into this guide.\n"
          cuc_addition = cuc_anchor + "\nAt pinned CUC 0.2.8 the generated non-empty `emen` observations are `excised`, `missing`, `redundant`, `remark`, and `restored`. Generated reference must keep `node_records_seen`, `nodes_with_value`, and `empty_observation_count` distinct: empty-string/`None` storage records are not semantic values and do not establish feature applicability. A finite **observed small domain** is also not automatically a **documented bounded** or **closed vocabulary**; closure requires parent-corpus evidence.\n"
          replace_once(cuc_anchor, cuc_addition, 'CUC empirical domain rule')

          replace_once(
              "3. validate exact parent corpus binding/schema requirements;",
              "3. validate parent artifact identity and the complete profile dependency contract, including mapped values/invariants;",
              'CI compatibility evidence',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit report and remove migration workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/r004-report-migrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/research/R-004-documentation-architecture.md .github/workflows/r004-report-migrate.yml
          git commit -m 'research: consolidate reconciled R-004 contract'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
