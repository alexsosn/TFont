# RED contract head: f737fe91c2633515490cfab0c35ceb03ca7be08b
name: R-001 report validation

on:
  push:
    branches:
      - research/r-001-distribution-architecture
    paths:
      - .github/workflows/r001-report-validation.yml
      - tests/research/test_r001_report.py
      - docs/research/R-001-distribution-architecture.md
      - docs/research/R-001-review-reconciliation.md
      - docs/research/R-001-R-005-reconciliation.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate reconciled R-001 research contract
        run: python -m unittest tests.research.test_r001_report -v
