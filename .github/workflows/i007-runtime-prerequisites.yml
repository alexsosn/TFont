name: I-007 runtime prerequisite evaluator

on:
  push:
    branches:
      - impl/i007-runtime-prerequisite-evaluator
  pull_request:
    paths:
      - 'src/tfont/runtime_prerequisites.py'
      - 'src/tfont/semantic_resolver.py'
      - 'src/tfont/semantic_ir.py'
      - 'src/tfont/semantic_validation.py'
      - 'tests/i007/**'
      - 'tests/i006/**'
      - 'tests/i005/**'
      - 'tests/i004/**'
      - 'docs/research/I-007*.md'
      - 'docs/plans/I-007*.md'
      - '.github/workflows/i007-runtime-prerequisites.yml'

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: I-007 fixture controls
        run: python -m unittest tests.i007.test_fixture_controls -v
      - name: I-007 runtime prerequisite contract
        run: python -m unittest discover -s tests/i007 -v
      - name: I-006 resolver regressions
        if: always()
        run: python -m unittest discover -s tests/i006 -v
      - name: I-005 semantic IR regressions
        if: always()
        run: python -m unittest discover -s tests/i005 -v
      - name: I-004 semantic validation regressions
        if: always()
        run: python -m unittest discover -s tests/i004 -v
