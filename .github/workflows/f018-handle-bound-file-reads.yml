name: F-018 handle-bound file reads

on:
  push:
    branches:
      - research/f-018-handle-bound-file-reads
  pull_request:
    paths:
      - src/tfont/parent_identity.py
      - tests/f018/**
      - tests/f012/**
      - tests/f014/**
      - tests/i003/**
      - docs/research/F-018-handle-bound-file-reads.md
      - docs/plans/F-018-handle-bound-file-reads-plan.md
      - .github/workflows/f018-handle-bound-file-reads.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handle-bound-file-reads:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: F-018 focused RED/GREEN contract
        run: python -m unittest discover -s tests/f018 -v
      - name: F-012 regressions
        if: always()
        run: python -m unittest discover -s tests/f012 -v
      - name: F-014 regressions
        if: always()
        run: python -m unittest discover -s tests/f014 -v
      - name: I-003 regressions
        if: always()
        run: python -m unittest discover -s tests/i003 -v
