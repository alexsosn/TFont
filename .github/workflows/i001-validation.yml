name: I-001 structural validator

on:
  push:
    branches:
      - impl/i-001-structural-validator
    paths:
      - .github/workflows/i001-validation.yml
      - docs/research/I-001-structural-validator-research.md
      - docs/plans/I-001-structural-validator-plan.md
      - pyproject.toml
      - schemas/**
      - src/tfont/**
      - tests/i001/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install RED test dependencies
        run: python -m pip install "jsonschema>=4.26,<5" "ruamel.yaml>=0.19.1,<0.20"

      - name: Run I-001 contract tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/i001 -v
