name: F-022 semantic digest JSON boundary

on:
  push:
    branches:
      - stability/f-022-semantic-digest-json-boundary
    paths:
      - src/tfont/semantic_digest_v2.py
      - src/tfont/digests.py
      - tests/f022/**
      - tests/f009/**
      - tests/i002/**
      - tests/i004/**
      - docs/research/F-022-semantic-digest-json-boundary.md
      - docs/plans/F-022-semantic-digest-json-boundary-plan.md
      - .github/workflows/f022-semantic-digest-json-boundary.yml
  pull_request:
    paths:
      - src/tfont/semantic_digest_v2.py
      - src/tfont/digests.py
      - tests/f022/**
      - tests/f009/**
      - tests/i002/**
      - tests/i004/**
      - docs/research/F-022-semantic-digest-json-boundary.md
      - docs/plans/F-022-semantic-digest-json-boundary-plan.md
      - .github/workflows/f022-semantic-digest-json-boundary.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-digest-json-boundary:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . build

      - name: Run F-022 focused RED/GREEN contract
        run: python -m unittest discover -s tests/f022 -v

      - name: Run F-009 regressions
        if: always()
        run: python -m unittest discover -s tests/f009 -v

      - name: Run I-002 regressions
        if: always()
        run: python -m unittest discover -s tests/i002 -v

      - name: Run I-004 regressions
        if: always()
        run: python -m unittest discover -s tests/i004 -v
