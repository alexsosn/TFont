name: D-001 README current status

on:
  push:
    branches:
      - docs/readme-current-status
    paths:
      - README.md
      - .github/workflows/d001-readme-status.yml
      - docs/research/D-001-readme-current-status.md
      - docs/plans/D-001-readme-current-status-plan.md
      - tests/docs/**
  pull_request:
    paths:
      - README.md
      - .github/workflows/d001-readme-status.yml
      - docs/research/D-001-readme-current-status.md
      - docs/plans/D-001-readme-current-status-plan.md
      - tests/docs/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run README status contract
        run: python -m unittest tests.docs.test_readme_status -v
