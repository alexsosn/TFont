name: F-016 custom schema recursion containment

on:
  push:
    branches:
      - feature/f-016-schema-recursion-containment
    paths:
      - src/tfont/source_validation.py
      - tests/f016/**
      - tests/f006/**
      - tests/f015/**
      - tests/f019/**
      - tests/f020/**
      - tests/i001/**
      - tests/i004/**
      - tests/packaging/test_schema_authority.py
      - docs/plans/F-016-custom-schema-recursion-containment-plan.md
      - .github/workflows/f016-custom-schema-recursion.yml
  pull_request:
    paths:
      - src/tfont/source_validation.py
      - tests/f016/**
      - tests/f006/**
      - tests/f015/**
      - tests/f019/**
      - tests/f020/**
      - tests/i001/**
      - tests/i004/**
      - tests/packaging/test_schema_authority.py
      - docs/plans/F-016-custom-schema-recursion-containment-plan.md
      - .github/workflows/f016-custom-schema-recursion.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f016-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  schema-recursion:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . build

      - name: Run established F-016 controls
        run: python -m unittest tests.f016.test_custom_schema_recursion_containment.CustomSchemaRecursionControls -v

      - name: Run intended F-016 RED/GREEN contract
        run: python -m unittest tests.f016.test_custom_schema_recursion_containment.CustomSchemaRecursionREDTests -v

      - name: Run F-006 deep-source regressions
        if: always()
        run: python -m unittest discover -s tests/f006 -v

      - name: Run F-015 direct-source regressions
        if: always()
        run: python -m unittest discover -s tests/f015 -v

      - name: Run F-019 source-path regressions
        if: always()
        run: python -m unittest discover -s tests/f019 -v

      - name: Run F-020 schema-root-path regressions
        if: always()
        run: python -m unittest discover -s tests/f020 -v

      - name: Run I-001 structural-validation regressions
        if: always()
        run: python -m unittest discover -s tests/i001 -v

      - name: Run I-004 semantic-validation regressions
        if: always()
        run: python -m unittest discover -s tests/i004 -v

      - name: Run packaged schema-authority regression
        if: always()
        run: python -m unittest tests.packaging.test_schema_authority -v
