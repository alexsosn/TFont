name: A-001 TF-native boundary

on:
  push:
    branches:
      - arch/a-001-tf-native-boundary
    paths:
      - AGENTS.md
      - docs/research/A-001-tf-native-runtime-boundary.md
      - docs/research/A-001-r005-oracc-zero-span-supersession.md
      - docs/research/A-001-r007-external-carrier-supersession.md
      - docs/plans/A-001-tf-native-runtime-boundary-plan.md
      - tests/architecture/test_tf_native_boundary.py
      - .github/workflows/a001-tf-native-boundary.yml
  pull_request:
    paths:
      - AGENTS.md
      - docs/research/A-001-tf-native-runtime-boundary.md
      - docs/research/A-001-r005-oracc-zero-span-supersession.md
      - docs/research/A-001-r007-external-carrier-supersession.md
      - docs/plans/A-001-tf-native-runtime-boundary-plan.md
      - tests/architecture/test_tf_native_boundary.py
      - .github/workflows/a001-tf-native-boundary.yml

jobs:
  architecture-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e . pytest
      - name: Run A-001 architecture contract tests
        run: python -m pytest -q tests/architecture/test_tf_native_boundary.py
