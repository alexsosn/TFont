name: I-010 minimize schema diff

on:
  push:
    branches:
      - impl/i010-value-set-predicate
    paths:
      - 'scripts/dev/i010_minimize_schema_diff.py'
      - '.github/workflows/i010-minimize-schema.yml'

permissions:
  contents: write

jobs:
  minimize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: impl/i010-value-set-predicate
          fetch-depth: 1
      - run: git fetch origin main --depth=1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/dev/i010_minimize_schema_diff.py
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/i010 -q
      - name: Commit minimal schema diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tfont/schemas/mapping.schema.json
          git diff --cached --check
          git commit -m 'I-010 cleanup: minimize schema diff'
          git push origin HEAD:impl/i010-value-set-predicate
