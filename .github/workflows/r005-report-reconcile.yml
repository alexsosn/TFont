name: R-005 report reconciliation

on:
  push:
    branches:
      - research/r-005-corpus-semantic-census
    paths:
      - .github/workflows/r005-report-reconcile.yml
      - scripts/research/r005_reconcile_report.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply narrow deterministic report reconciliation
        run: python scripts/research/r005_reconcile_report.py

      - name: Commit reconciled report when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/R-005-corpus-semantic-census.md
          if git diff --cached --quiet; then
            echo 'Authoritative report already reconciled.'
            exit 0
          fi
          git commit -m 'research: reconcile R-005 report with generated evidence'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
