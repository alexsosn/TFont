# RED contract head: 18cac10a23b6c4459676911ccfc7bfc8c76296fa
name: R-002 report validation

on:
  push:
    branches:
      - research/r-002-ontology-governance
    paths:
      - .github/workflows/r002-report-validation.yml
      - tests/research/test_r002_report.py
      - docs/research/R-002-ontology-governance.md
      - docs/research/R-002-review-reconciliation.md
      - docs/research/R-002-R-005-reconciliation.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate reconciled R-002 research contract
        run: python -m unittest tests.research.test_r002_report -v
