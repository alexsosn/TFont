name: R-017 external reference research

on:
  push:
    branches:
      - research/r-017-external-authority-semantics
    paths:
      - .github/workflows/r017-reference-policy.yml
      - docs/research/R-017-external-authority-semantics.md
      - docs/research/R-017-post-review-amendment.md
      - scripts/research/r017_reference_policy.py
      - tests/research/test_r017_reference_policy.py
      - tests/research/test_r017_post_r016_contract.py
  pull_request:
    paths:
      - .github/workflows/r017-reference-policy.yml
      - docs/research/R-017-external-authority-semantics.md
      - docs/research/R-017-post-review-amendment.md
      - scripts/research/r017_reference_policy.py
      - tests/research/test_r017_reference_policy.py
      - tests/research/test_r017_post_r016_contract.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: >-
          python -m pytest -q
          tests/research/test_r017_reference_policy.py
          tests/research/test_r017_post_r016_contract.py
