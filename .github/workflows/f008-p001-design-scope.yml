name: F-008 P-001 design scope

on:
  push:
    branches:
      - fix/f-008-p001-design-scope
    paths:
      - .github/workflows/f008-p001-design-scope.yml
      - docs/research/F-008-p001-design-scope.md
      - docs/plans/F-008-p001-design-scope-plan.md
      - tests/f008/**
      - tests/plans/test_p001_plan.py
  pull_request:
    paths:
      - .github/workflows/f008-p001-design-scope.yml
      - docs/research/F-008-p001-design-scope.md
      - docs/plans/F-008-p001-design-scope-plan.md
      - tests/f008/**
      - tests/plans/test_p001_plan.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-scope-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install package and build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install build

      - name: Run F-008 and historical P-001 contracts
        run: |
          python -m unittest discover -s tests/f008 -v
          python tests/plans/test_p001_plan.py
