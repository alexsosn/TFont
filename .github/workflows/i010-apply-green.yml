name: I-010 apply GREEN patch

on:
  push:
    branches:
      - impl/i010-value-set-predicate
    paths:
      - 'tests/i010/**'
      - 'scripts/dev/i010_apply.py'
      - '.github/workflows/i010-apply-green.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: impl/i010-value-set-predicate
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/dev/i010_apply.py
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/i010 -q
      - name: Commit GREEN implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tfont/schemas/mapping.schema.json src/tfont/semantic_digest_v2.py src/tfont/semantic_ir.py src/tfont/semantic_resolver.py src/tfont/semantic_execution.py
          git diff --cached --check
          git commit -m 'I-010 GREEN: finite value-set execution'
          git push origin HEAD:impl/i010-value-set-predicate
