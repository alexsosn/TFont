# RED contract head: c2fa007e3754eee06ca9ee7cf53a7993dbfbc442
name: R-004 report validation

on:
  push:
    branches:
      - research/r-004-documentation-architecture
    paths:
      - .github/workflows/r004-report-validation.yml
      - tests/research/test_r004_report.py
      - docs/research/R-004-documentation-architecture.md
      - docs/research/R-004-reconciliation.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate reconciled R-004 research contract
        run: python -m unittest tests.research.test_r004_report -v
