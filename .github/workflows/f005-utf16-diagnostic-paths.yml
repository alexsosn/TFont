name: F-005 UTF-16 diagnostic paths

on:
  push:
    branches:
      - fix/utf16-diagnostic-paths
    paths:
      - "src/tfont/digests.py"
      - "tests/i002/test_utf16_diagnostic_paths.py"
      - "docs/research/F-005-utf16-diagnostic-paths.md"
      - "docs/plans/F-005-utf16-diagnostic-paths-plan.md"
      - ".github/workflows/f005-utf16-diagnostic-paths.yml"
  pull_request:
    paths:
      - "src/tfont/digests.py"
      - "tests/i002/test_utf16_diagnostic_paths.py"
      - "docs/research/F-005-utf16-diagnostic-paths.md"
      - "docs/plans/F-005-utf16-diagnostic-paths-plan.md"
      - ".github/workflows/f005-utf16-diagnostic-paths.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Show environment
        run: |
          python --version
          python -c "import rfc8785; print('rfc8785', getattr(rfc8785, '__version__', 'unknown'))"

      - name: Run F-005 focused tests
        run: python -m unittest tests.i002.test_utf16_diagnostic_paths -v

      - name: Run I-002 suite
        run: python -m unittest discover -s tests/i002 -v
