name: F-021 feature ID ownership

on:
  push:
    branches:
      - feature/f-021-feature-id-uniqueness
    paths:
      - CONTRIBUTING.md
      - docs/research/F-*.md
      - docs/plans/F-021-*.md
      - scripts/check_f_series_ownership.py
      - tests/f021/**
      - tests/d004/**
      - .github/workflows/f021-feature-id-ownership.yml
  pull_request:
    paths:
      - CONTRIBUTING.md
      - docs/research/F-*.md
      - docs/plans/F-021-*.md
      - scripts/check_f_series_ownership.py
      - tests/f021/**
      - tests/d004/**
      - .github/workflows/f021-feature-id-ownership.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f021-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  feature-id-ownership:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run post-D-004 repository controls
        run: python -m unittest tests.f021.test_feature_id_ownership.RepositoryMetadataControls -v

      - name: Run F-021 ownership checker contract
        run: python -m unittest tests.f021.test_feature_id_ownership.FeatureOwnershipCheckerREDTests -v

      - name: Run contributor documentation RED/GREEN contract
        run: python -m unittest tests.f021.test_contributor_documentation -v

      - name: Run D-004 ownership regression
        if: always()
        run: python -m unittest discover -s tests/d004 -v

      - name: Run direct checker when implemented
        if: always()
        shell: bash
        run: |
          if [[ -f scripts/check_f_series_ownership.py ]]; then
            python scripts/check_f_series_ownership.py
          else
            echo "checker intentionally absent on F-021 RED head"
          fi
