name: I-010 finite value-set predicate

on:
  push:
    branches:
      - impl/i010-value-set-predicate
    paths:
      - 'tests/i010/**'
      - 'src/tfont/schemas/mapping.schema.json'
      - 'src/tfont/semantic_ir.py'
      - 'src/tfont/semantic_resolver.py'
      - 'src/tfont/semantic_execution.py'
      - '.github/workflows/i010-value-set.yml'
  pull_request:
    paths:
      - 'tests/i010/**'
      - 'src/tfont/schemas/mapping.schema.json'
      - 'src/tfont/semantic_ir.py'
      - 'src/tfont/semantic_resolver.py'
      - 'src/tfont/semantic_execution.py'
      - '.github/workflows/i010-value-set.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/i010 -q
