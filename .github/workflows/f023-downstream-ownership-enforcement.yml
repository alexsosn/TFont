# Issue: #115
name: F-023 downstream ownership enforcement

on:
  push:
    branches:
      - impl/f023-downstream-ownership-enforcement
  pull_request:
    paths:
      - "docs/research/F-*.md"
      - "docs/plans/F-*.md"
      - ".github/workflows/f*.yml"
      - ".github/workflows/f*.yaml"
      - "tests/f*/**"
      - "scripts/check_f_series_ownership.py"
      - "tests/f023/**"
      - "docs/research/F-023-*.md"
      - "docs/plans/F-023-*.md"
      - ".github/workflows/f023-*.yml"
      - "CONTRIBUTING.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  downstream-ownership:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run F-023 focused RED/GREEN contract
        run: python -m unittest discover -s tests/f023 -v
      - name: Run F-021 ownership regressions
        if: always()
        run: python -m unittest discover -s tests/f021 -v
      - name: Run D-006 migration regressions
        if: always()
        run: python -m unittest discover -s tests/d006 -v
      - name: Run repository ownership checker
        if: always()
        run: python scripts/check_f_series_ownership.py .
