name: R-015 ontology bundle research

on:
  push:
    branches:
      - research/r-015-ontology-bundle-locks
    paths:
      - .github/workflows/r015-bundle-research.yml
      - docs/research/R-015-ontology-bundle-locks.md
      - scripts/research/r015_bundle_id.py
      - tests/research/test_r015_bundle_id.py
      - tests/research/test_r015_bridge_provenance.py
      - tests/research/test_r015_jcs_contract.py
      - tests/research/test_r015_lock_identity.py
      - tests/research/test_r015_active_flag.py
      - src/tfont/digests.py
  pull_request:
    paths:
      - .github/workflows/r015-bundle-research.yml
      - docs/research/R-015-ontology-bundle-locks.md
      - scripts/research/r015_bundle_id.py
      - tests/research/test_r015_bundle_id.py
      - tests/research/test_r015_bridge_provenance.py
      - tests/research/test_r015_jcs_contract.py
      - tests/research/test_r015_lock_identity.py
      - tests/research/test_r015_active_flag.py
      - src/tfont/digests.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research head
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install TFont and test runner
        run: python -m pip install -e . pytest

      - name: Run R-015 research contract tests
        run: >-
          python -m pytest -q
          tests/research/test_r015_bundle_id.py
          tests/research/test_r015_bridge_provenance.py
          tests/research/test_r015_jcs_contract.py
          tests/research/test_r015_lock_identity.py
          tests/research/test_r015_active_flag.py
