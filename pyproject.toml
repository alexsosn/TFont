[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfont"
version = "0.0.0"
description = "Ontological layer for Text-Fabric corpora"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.26,<5",
  "ruamel.yaml>=0.19.1,<0.20",
]

[tool.setuptools.packages.find]
where = ["src"]
